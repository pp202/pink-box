spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corckboard}
    username: ${DB_USERNAME:corckboard}
    password: ${DB_PASSWORD:corckboard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
